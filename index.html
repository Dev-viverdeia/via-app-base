<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícone da aba: o logo do negócio. Troque a extensão se ele for .jpg ou .webp; sem logo em public/, o navegador usa o ícone padrão. -->
    <link rel="icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Meu app</title>
    <!-- O cartão do link: é isto que aparece quando o endereço do app é colado
         no WhatsApp, no LinkedIn ou num e-mail. A casa troca o nome no título e
         a extensão da imagem junto com as linhas acima; a descrição é sua —
         reescreva-a com o que este app faz, em uma frase. -->
    <meta name="description" content="Aplicativo do seu negócio, no navegador." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meu app" />
    <meta property="og:description" content="Aplicativo do seu negócio, no navegador." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/via-ponte.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
